; PlatformIO Project Configuration File
;
; ONE project, MANY independent programs ("environments").
; Run one separately:
;   pio run -e task_2_1 -t upload      (build + flash that env)
;   pio device monitor -b 115200       (open serial monitor)
; or click the env's Upload task in the PlatformIO sidebar.
;
; Layout: every task lives in its OWN folder under src/homeworks/, e.g.
;   src/homeworks/task_2_1/   -> built by [env:task_2_1]
; A folder is compiled as one program, so a task can span several files
; (helpers, classes) as long as it has a single setup()/loop().
;
; build_src_filter picks WHICH files compile for an env (paths relative to src/):
;   +<glob> includes, -<glob> excludes.
;   "-<*> +<homeworks/task_2_1/>"  = drop everything, then add back one folder.
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Which env builds by default (plain "pio run" / the Default sidebar task).
default_envs = esp32doit-devkit-v1

; Options here are inherited by EVERY [env:...] below, so we don't repeat them.
[env]
platform = espressif32@^6.5.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200


; ============================================================
;  MAIN PROJECT — builds everything in src/ EXCEPT the homeworks tree.
; ============================================================
[env:esp32doit-devkit-v1]
lib_deps = mbed-seeed/BluetoothSerial@0.0.0+sha.f56002898ee8
build_src_filter = +<*> -<homeworks/>

[env:task_2_1]
build_src_filter = -<*> +<homeworks/task_2_1/>
build_flags = -Isrc/homeworks/task_2_1/include

[env:task_2_2]
build_src_filter = -<*> +<homeworks/task_2_2/>

[env:task_2_3]
build_src_filter = -<*> +<homeworks/task_2_3/>
